[project]
name = "gdd-harness"
version = "0.1.0"
description = "Auditable multi-agent game design document workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "Pillow>=11.0",
  "python-docx>=1.1",
  "Markdown>=3.7",
  "beautifulsoup4>=4.12",
  "cryptography>=43.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
